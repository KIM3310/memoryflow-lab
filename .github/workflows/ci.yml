name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest --cov=memoryflow --cov-report=term-missing --cov-fail-under=90

      - name: Reproduce evidence
        run: |
          python -m scripts.build_evidence > /tmp/memoryflow-evidence.json
          git diff --exit-code -- site/results.json evidence/benchmark-summary.md

