name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest --cov=memoryflow --cov-report=term-missing --cov-fail-under=90

      - name: Reproduce evidence
        run: |
          python -m scripts.build_evidence > /tmp/memoryflow-evidence.json
          python -m scripts.build_measurement_summary --check
          git diff --exit-code -- site/results.json evidence/benchmark-summary.md

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build and smoke-test container
        run: make docker-verify
